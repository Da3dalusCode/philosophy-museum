name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify compiled building manifest
        run: |
          npm run check:museum-building
          npm run check:route-manifest

      - name: Validate Museum masterplan and building
        run: |
          npm run validate:museum-masterplan
          npm run validate:museum-building-plan

      - name: Audit routes, Museum, assets, universal depth, editorial metadata, accuracy, and integrity
        run: |
          npm run audit:routing
          npm run audit:museum
          npm run audit:museum-mobile-controls
          npm run audit:museum-assets
          npm run audit:articles
          npm run audit:articles:reviewed
          npm run audit:editorial
          npm run test:editorial
          npm run audit:accuracy
          npm run audit:integrity

      - name: Build
        run: npm run build

      - name: Enforce initial bundle budgets
        run: npm run report:bundle

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
